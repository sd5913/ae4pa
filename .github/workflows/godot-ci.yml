name: Godot CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Linux headless smoke
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    env:
      GODOT_VERSION: '4.7.2'
      GODOT_SHA256: cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false

      - name: Install Godot
        run: |
          archive="Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip"
          curl --fail --silent --show-error --location --retry 3 \
            "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable/$archive" \
            --output "$RUNNER_TEMP/$archive"
          printf '%s  %s\n' "$GODOT_SHA256" "$RUNNER_TEMP/$archive" | sha256sum --check
          unzip -q "$RUNNER_TEMP/$archive" -d "$RUNNER_TEMP"
          install -m 0755 "$RUNNER_TEMP/${archive%.zip}" "$RUNNER_TEMP/godot"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"

      - name: Import project
        run: |
          mkdir -p "$RUNNER_TEMP/godot-logs"
          godot --version
          if ! godot --headless --path . --editor --import --quit > "$RUNNER_TEMP/godot-logs/import.log" 2>&1; then
            tail -n 100 "$RUNNER_TEMP/godot-logs/import.log"
            exit 1
          fi

      - name: Run smoke tests
        run: |
          failed=0
          run_smoke() {
            local name="$1"
            shift
            local test_root="$RUNNER_TEMP/godot-test-data/$name"
            local log="$RUNNER_TEMP/godot-logs/$name.log"
            mkdir -p "$test_root"/{config,data,cache}
            if XDG_CONFIG_HOME="$test_root/config" XDG_DATA_HOME="$test_root/data" \
              XDG_CACHE_HOME="$test_root/cache" \
              timeout 3m godot --headless --path . "$@" > "$log" 2>&1; then
              echo "PASS: $name"
            else
              echo "::error title=Godot smoke failed::$name"
              tail -n 80 "$log"
              failed=1
            fi
          }

          run_smoke foundation --script res://scenes/tests/core/foundation_smoke.gd
          run_smoke task_checkpoint --script res://scenes/tests/core/task_checkpoint_smoke.gd
          run_smoke staff_core res://scenes/tests/staff/staff_core_smoke.tscn
          run_smoke work_items res://scenes/tests/staff/work_items_smoke.tscn
          run_smoke known_monster_rules --script res://scenes/tests/doors/known_monster_rules_smoke.gd
          run_smoke task_door_lifecycle --script res://scenes/tests/doors/task_door_lifecycle_smoke.gd
          run_smoke localization --script res://scenes/tests/core/localization_smoke.gd
          run_smoke late_mainline --script res://scenes/tests/core/late_mainline_main_flow_smoke.gd -- --ui-smoke
          exit "$failed"

      - name: Upload Godot logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: godot-linux-logs
          path: ${{ runner.temp }}/godot-logs/
          if-no-files-found: ignore
          retention-days: 7
